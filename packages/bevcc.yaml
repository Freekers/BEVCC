# =============================================================================
# BEVCC - Balans Energie EVCC Companion
# https://github.com/Freekers/BEVCC
#
# Fanproject: niet officieel en niet gelieerd aan Balans Energie.
# "Balans Energie" is een handelsmerk van Balans Energie. Gebruik op eigen risico.
#
# EVCC blijft de baas over je laadpunt. BEVCC verandert alleen de EVCC-modus
# om prijsredenen, en zet daarna de modus terug die er stond:
#
#   pauze  (modus -> Uit)    prijspiek: all-in afnameprijs boven 'Pauze boven'
#                            (vanuit Smart en Snel)
#   boost  (modus -> Snel)   goedkope EMS-import: het Balans-EMS laadt de
#                            thuisaccu uit het net, de all-in prijs ligt onder
#                            'Boost onder' en de thuisaccu zit op of boven de
#                            ondergrens (alleen vanuit Smart)
#                            of goedkope EMS-export: het EMS levert stroom uit
#                            de thuisaccu terug voor een all-in prijs op of
#                            onder 'Boost bij export onder' (standaard uit)
#
#   Laadstroom regelen (optioneel): tijdens een boost zet BEVCC de maximale
#   laadstroom van EVCC zo, dat de auto niet meer neemt dan er naar de
#   thuisaccu gaat (import), en daarna terug.
#
#   Een prijspiek gaat altijd voor een boost.
#   BEVCC houdt geen rekening met vertrektijd of gewenste laadtoestand: een
#   pauze gaat ook door tijdens een laadplan in EVCC.
#   Zet alle tarief- en prijsgrenzen in EVCC uit (zie README.md).
#   Verander je zelf de modus tijdens een pauze/boost, dan stapt BEVCC opzij
#   tot die pauze/boost-situatie voorbij is.
#
# Prijs voor de beslissingen (sensor.bevcc_afnameprijs), per minuut:
#   - tijdens een aFRR-importsessie van jouw EMS (alleen Balans weet dat, via
#     de Balans-API): de live onbalansprijs 'Invoeden'. Die kolom bevat de
#     afregelprijs, en daartegen wordt aFRR-import afgerekend.
#   - anders: de live onbalansprijs 'Afnemen'.
#   (TenneT-gegevens per minuut, via services.tenergy.nl)
#   Terugval: de aFRR-prijs van Balans, daarna de kwartierprijs van Balans
#   (sinds 18 november 2026 alleen tijdens een aFRR-sessie of dynamische
#   import: de Balans-API geeft geen onbalansprijzen meer).
# Voor een boost (sensor.bevcc_boostprijs) geldt in een kwartier met
# dynamische (day-ahead) import zonder aFRR-sessie de dynamische prijs.
# Voor een boost bij export (sensor.bevcc_exportprijs): tijdens een
# aFRR-exportsessie de live onbalansprijs 'Afnemen' (opregelprijs), anders
# 'Invoeden'. Ook all-in, met dezelfde formule als de afnameprijs.
#
# Installatie en uitleg: zie README.md. Kort:
#   1. secrets.yaml:
#        bevcc_balans_cookie: "<Cookie-header van een ingelogde sessie op
#                              dashboard.balansenergie.nl>"
#        bevcc_evcc_prefix: "evcc"       # naam van je EVCC-integratie
#        bevcc_evcc_laadpunt: "alfen"    # zoals in select.evcc_alfen_mode
#   2. Dit bestand in /config/packages/, met in configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Configuratie controleren en Home Assistant herstarten.
#
# Dit bestand hoef je niet aan te passen: instellingen staan in secrets.yaml
# en in de helpers (via het dashboard). Een update = dit bestand vervangen.
# =============================================================================

# -----------------------------------------------------------------------------
# 0. Configuratie en instellingen
# -----------------------------------------------------------------------------
input_text:
  # Uit secrets.yaml; bij elke herstart opnieuw ingelezen.
  bevcc_evcc_prefix:
    name: "BEVCC EVCC-prefix"
    icon: mdi:cog
    max: 32
    initial: !secret bevcc_evcc_prefix
  bevcc_evcc_laadpunt:
    name: "BEVCC EVCC-laadpunt"
    icon: mdi:ev-station
    max: 32
    initial: !secret bevcc_evcc_laadpunt
  # Status, beheerd door de automatisering.
  bevcc_te_herstellen_modus:
    name: "BEVCC te herstellen EVCC-modus"
    icon: mdi:backup-restore
    max: 16
  # Laadstroomregeling: de maximale laadstroom van vóór de regeling (leeg =
  # niets terug te zetten), en de laatste waarde die BEVCC zelf zette
  # ('handmatig' = iemand anders wijzigde hem tijdens deze boost).
  bevcc_te_herstellen_stroom:
    name: "BEVCC te herstellen max. laadstroom"
    icon: mdi:backup-restore
    max: 16
  bevcc_ingestelde_stroom:
    name: "BEVCC ingestelde max. laadstroom"
    icon: mdi:current-ac
    max: 16
  # Versie van de instellingen (niet van BEVCC), beheerd door 'BEVCC
  # standaardwaarden': welke nieuwe instellingen al een beginwaarde kregen.
  #   leeg  = van voor 1.4
  #   2     = sinds 1.4 (aan/uit-schakelaars voor boost, negatieve grenzen)
  bevcc_instellingen_versie:
    name: "BEVCC versie van de instellingen"
    icon: mdi:numeric
    max: 8

# Geen 'initial': wijzigingen via het dashboard blijven bewaard, ook bij
# updates. Standaardwaarden zet de automatisering 'BEVCC standaardwaarden'
# eenmalig (zie sectie 6).
input_number:
  bevcc_pauze_boven:
    name: "BEVCC pauze boven (all-in)"
    unit_of_measurement: "EUR/kWh"
    min: 0.10
    max: 1.50
    step: 0.01
    mode: box
    icon: mdi:cash-lock
  # Mag negatief zijn: de all-in prijs komt onder nul als de kale prijs
  # onder ongeveer -108 EUR/MWh zakt (onbalans: vaak tijdens afregelen).
  # Aan/uit met input_boolean.bevcc_boost_import.
  bevcc_boost_onder:
    name: "BEVCC boost onder (all-in)"
    unit_of_measurement: "EUR/kWh"
    min: -2.00
    max: 0.50
    step: 0.01
    mode: box
    icon: mdi:cash-fast
  # All-in exportprijs (wat het EMS voor teruggeleverde stroom krijgt,
  # omgerekend met dezelfde formule als de afnameprijs) waarop of waaronder
  # BEVCC de auto laat laden van de thuisaccu in plaats van te verkopen. Mag
  # negatief zijn. Aan/uit met input_boolean.bevcc_boost_export.
  bevcc_boost_export_onder:
    name: "BEVCC boost bij export onder (all-in)"
    unit_of_measurement: "EUR/kWh"
    min: -2.00
    max: 1.50
    step: 0.01
    mode: box
    icon: mdi:cash-refund
  # Netafname (zonder de auto) die nodig is voor een boost. Een lopende boost
  # stopt als de netafname (met de auto) onder deze waarde - 1 kW zakt.
  # Houdt het EMS het netvermogen constant als de auto start, zet dit dan dicht
  # bij het laadvermogen van de auto, zodat de import de auto dekt (of zet
  # 'laadstroom regelen' aan).
  # Een boost bij export start pas als het net minstens deze waarde
  # terugkrijgt (zie 'BEVCC goedkope export').
  bevcc_boost_min_import:
    name: "BEVCC boost minimaal EMS-vermogen"
    unit_of_measurement: "kW"
    min: 0.5
    max: 16
    step: 0.5
    mode: box
    icon: mdi:transmission-tower-import
  # Geen boost onder deze laadtoestand; een lopende boost stopt 2 % eronder.
  bevcc_accu_ondergrens:
    name: "BEVCC thuisaccu-ondergrens voor boost"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 1
    mode: box
    icon: mdi:home-battery-outline
  # Energiebelasting incl. btw per kWh. Elk jaar per 1 januari bijwerken;
  # 2026, schijf 1 (t/m 10.000 kWh): 0,11085.
  bevcc_energiebelasting:
    name: "BEVCC energiebelasting (incl. btw)"
    unit_of_measurement: "EUR/kWh"
    min: 0
    max: 0.5
    step: 0.00001
    mode: box
    icon: mdi:bank
  # Leverkosten (opslag) van Balans Energie per kWh, incl. btw (0,02).
  bevcc_leverkosten:
    name: "BEVCC leverkosten (incl. btw)"
    unit_of_measurement: "EUR/kWh"
    min: 0
    max: 0.1
    step: 0.001
    mode: box
    icon: mdi:cash-plus

input_select:
  # Welke EMS-import een boost mag starten (van betrouwbaar naar ruim):
  #   alleen aFRR       alleen tijdens een aFRR-importsessie van Balans. De
  #                     aFRR-importprijs is de afregelprijs, en die kan binnen
  #                     het kwartier alleen nog dalen.
  #   aFRR + dynamisch  ook tijdens dynamische (day-ahead) import van Balans.
  #                     Die prijs staat een dag vooraf vast.
  #   aFRR + onbalans   ook bij alle andere EMS-import (dus ook dynamisch),
  #                     afgerekend tegen de onbalansprijs 'Afnemen', die aan
  #                     het eind van het kwartier nog kan stijgen
  #                     (bijvoorbeeld regeltoestand 2).
  bevcc_boost_bij:
    name: "BEVCC boost bij"
    icon: mdi:source-branch-check
    options:
      - alleen aFRR
      - aFRR + dynamisch
      - aFRR + onbalans
  # Status, beheerd door de automatisering - niet zelf wijzigen.
  bevcc_status:
    name: "BEVCC status"
    icon: mdi:state-machine
    options:
      - rust
      - pauze
      - boost
      - handmatig

input_boolean:
  # Uit = standaardwaarden worden (opnieuw) ingesteld; zie sectie 6.
  bevcc_standaardwaarden:
    name: "BEVCC standaardwaarden ingesteld"
    icon: mdi:restore
  # Boost aan/uit. Los van de grenzen, omdat elke grens (ook een negatieve)
  # een geldige prijs is. Standaard: boost bij import aan, bij export uit.
  bevcc_boost_import:
    name: "BEVCC boost bij goedkope import"
    icon: mdi:transmission-tower-import
  bevcc_boost_export:
    name: "BEVCC boost bij goedkope export"
    icon: mdi:transmission-tower-export
  # Aan = tijdens een boost de maximale laadstroom van EVCC regelen, zodat de
  # auto (bij import) niet meer neemt dan er naar de thuisaccu gaat. Na de
  # boost komt de oorspronkelijke waarde terug. Standaard uit.
  bevcc_laadstroom_regelen:
    name: "BEVCC laadstroom regelen bij boost"
    icon: mdi:current-ac
  # Aan = een boost bij export kijkt niet naar de accu-ondergrens: de auto
  # mag de thuisaccu dan leeg laden tot het EMS stopt met terugleveren.
  bevcc_boost_export_negeer_ondergrens:
    name: "BEVCC boost bij export negeert accu-ondergrens"
    icon: mdi:battery-alert-variant-outline

# -----------------------------------------------------------------------------
# 1. Bronnen
# -----------------------------------------------------------------------------
rest:
  # Balans Energie klantprijzen (onofficiële API, één verzoek per minuut).
  # Lopend kwartier = het prices[]/afrrDiscovery[]-item waarvan start (ms
  # sinds 1970) het begin van het lopende kwartier is. Een antwoord dat geen
  # JSON is (verlopen cookie -> inlogpagina) maakt deze sensoren unavailable.
  - resource: https://dashboard.balansenergie.nl/customer/current-prices/api/
    headers:
      Cookie: !secret bevcc_balans_cookie
      Accept: application/json
    scan_interval: 60
    timeout: 20
    binary_sensor:
      # Aan zolang Balans jouw EMS in het lopende kwartier een
      # aFRR-importsessie heeft gegeven (afrrDiscovery.directions bevat
      # 'import'). Overloop: in de eerste 5 min van een kwartier telt een
      # sessie in het vorige kwartier ook, omdat Balans een nieuw kwartier
      # pas na een paar minuten meldt.
      - name: "BEVCC aFRR-importsessie"
        unique_id: bevcc_afrr_importsessie
        icon: mdi:transmission-tower-import
        availability: >-
          {{ value_json is defined and value_json is mapping and 'afrrDiscovery' in value_json }}
        value_template: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set q = nu - nu % 900000 %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set disc = data.get('afrrDiscovery', []) %}
          {% set cur = disc | selectattr('start', 'eq', q) | map(attribute='directions') | first | default([], true) %}
          {% set prev = disc | selectattr('start', 'eq', q - 900000) | map(attribute='directions') | first | default([], true) %}
          {{ 'import' in cur or ('import' in prev and nu - q < 300000) }}

      # Hetzelfde voor een aFRR-exportsessie (opregelen): het EMS levert extra
      # terug, afgerekend tegen de opregelprijs (TenneT 'Afnemen'). Ook met
      # 5 min overloop.
      - name: "BEVCC aFRR-exportsessie"
        unique_id: bevcc_afrr_exportsessie
        icon: mdi:transmission-tower-export
        availability: >-
          {{ value_json is defined and value_json is mapping and 'afrrDiscovery' in value_json }}
        value_template: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set q = nu - nu % 900000 %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set disc = data.get('afrrDiscovery', []) %}
          {% set cur = disc | selectattr('start', 'eq', q) | map(attribute='directions') | first | default([], true) %}
          {% set prev = disc | selectattr('start', 'eq', q - 900000) | map(attribute='directions') | first | default([], true) %}
          {{ 'export' in cur or ('export' in prev and nu - q < 300000) }}

      # Aan in een kwartier met een dynamisch (day-ahead) exportplan
      # (dayAheadPlans, direction 'export'), met 5 min overloop. De prijs
      # daarvan staat (nog) niet in de API: BEVCC boost dan niet bij export.
      - name: "BEVCC dynamische export"
        unique_id: bevcc_dynamische_export
        icon: mdi:calendar-export
        availability: >-
          {{ value_json is defined and value_json is mapping and 'prices' in value_json }}
        value_template: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set q = nu - nu % 900000 %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set plannen = data.get('dayAheadPlans', []) | selectattr('direction', 'eq', 'export') | list %}
          {{ plannen | selectattr('start', 'le', nu) | selectattr('end', 'gt', nu) | list | count > 0
             or (nu - q < 300000 and plannen | selectattr('start', 'eq', q - 900000) | list | count > 0) }}

    sensor:
      # De eigen all-in kwartierprijs van Balans, zoals het Balans-dashboard
      # hem toont: aFRR-importprijs tijdens een sessie, de dynamische prijs
      # tijdens dynamische import, en het gemiddelde van die twee ('Dynamisch +
      # aFRR') als beide spelen. Sinds 18 november 2026 geeft de API alleen nog
      # deze prijzen, niet meer de onbalansprijs: buiten een aFRR-sessie of
      # dynamische import is deze sensor dus niet beschikbaar. (Geeft de API
      # toch onbalans_import, zoals vroeger, dan telt die.) Balans werkt het
      # lopende kwartier pas een paar minuten na de start bij; alleen als
      # terugval en ter vergelijking.
      - name: "BEVCC Balans kwartierprijs"
        unique_id: bevcc_balans_kwartierprijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set ns = namespace(kaal=none) %}
          {% for p in data.get('prices', []) if p.start <= nu < p.end %}
            {% set dirs = data.get('afrrDiscovery', []) | selectattr('start', 'eq', p.start)
                          | map(attribute='directions') | first | default([], true) %}
            {% set v = p.get('values') or {} %}
            {% set afrr = v.get('afrr_import') if 'import' in dirs else none %}
            {% set dyn = v.get('day_ahead_import') %}
            {% if afrr is number and dyn is number and v.get('day_ahead_afrr_import') is number %}
              {% set ns.kaal = v.get('day_ahead_afrr_import') %}
            {% elif afrr is number %}{% set ns.kaal = afrr %}
            {% elif dyn is number %}{% set ns.kaal = dyn %}
            {% elif v.get('onbalans_import') is number %}{% set ns.kaal = v.get('onbalans_import') %}{% endif %}
          {% endfor %}
          {{ ns.kaal is number }}
        value_template: >-
          {% set eb = states('input_number.bevcc_energiebelasting') | float(0.11085) %}
          {% set leverkosten = states('input_number.bevcc_leverkosten') | float(0.02) %}
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set ns = namespace(kaal=none) %}
          {% for p in data.get('prices', []) if p.start <= nu < p.end %}
            {% set dirs = data.get('afrrDiscovery', []) | selectattr('start', 'eq', p.start)
                          | map(attribute='directions') | first | default([], true) %}
            {% set v = p.get('values') or {} %}
            {% set afrr = v.get('afrr_import') if 'import' in dirs else none %}
            {% set dyn = v.get('day_ahead_import') %}
            {% if afrr is number and dyn is number and v.get('day_ahead_afrr_import') is number %}
              {% set ns.kaal = v.get('day_ahead_afrr_import') %}
            {% elif afrr is number %}{% set ns.kaal = afrr %}
            {% elif dyn is number %}{% set ns.kaal = dyn %}
            {% elif v.get('onbalans_import') is number %}{% set ns.kaal = v.get('onbalans_import') %}{% endif %}
          {% endfor %}
          {{ (ns.kaal * 1.21 + leverkosten + eb) | round(5) if ns.kaal is number else none }}

      # aFRR-importprijs van Balans voor het lopende kwartier (kaal, EUR/kWh).
      # Terugval voor de sessieprijs als de TenneT-bron niet werkt.
      - name: "BEVCC Balans aFRR-importprijs"
        unique_id: bevcc_balans_afrr_importprijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {{ data.get('prices', []) | selectattr('start', 'le', nu) | selectattr('end', 'gt', nu)
             | selectattr('values.afrr_import', 'number') | list | count > 0 }}
        value_template: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set ns = namespace(v=none) %}
          {% for p in data.get('prices', []) if p.start <= nu < p.end %}
            {% set ns.v = p['values']['afrr_import'] %}
          {% endfor %}
          {{ ns.v | round(5) if ns.v is number else none }}

      # Dynamische (day-ahead) importprijs van Balans voor het lopende kwartier
      # (kaal, EUR/kWh); alleen beschikbaar in kwartieren met een dynamisch
      # importplan. Balans meldt het kwartier pas na een paar minuten: tot
      # dan geldt in de eerste 5 min de prijs van het vorige kwartier, als dat
      # ook dynamisch was (dynamische blokken zijn vaak meerdere kwartieren).
      - name: "BEVCC Balans dynamisch prijs"
        unique_id: bevcc_balans_dynamisch_prijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:calendar-clock
        availability: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set q = nu - nu % 900000 %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set prijzen = data.get('prices', []) %}
          {% set cur = prijzen | selectattr('start', 'le', nu) | selectattr('end', 'gt', nu) | list %}
          {% set prev = prijzen | selectattr('start', 'eq', q - 900000) | list if nu - q < 300000 else [] %}
          {{ (cur if cur else prev) | selectattr('values.day_ahead_import', 'number') | list | count > 0 }}
        value_template: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set q = nu - nu % 900000 %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set prijzen = data.get('prices', []) %}
          {% set cur = prijzen | selectattr('start', 'le', nu) | selectattr('end', 'gt', nu) | list %}
          {% set prev = prijzen | selectattr('start', 'eq', q - 900000) | list if nu - q < 300000 else [] %}
          {% set v = (cur if cur else prev) | selectattr('values.day_ahead_import', 'number')
                     | map(attribute='values.day_ahead_import') | first | default(none) %}
          {{ v | round(5) if v is number else none }}

      # Kale exportprijs van Balans voor het lopende kwartier: tijdens een
      # aFRR-exportsessie de aFRR-exportprijs (in de bekeken gegevens gelijk
      # aan de opregelprijs). Sinds 18 november 2026 geeft de API geen
      # onbalansprijs meer: buiten een aFRR-exportsessie is deze sensor dus
      # niet beschikbaar (geeft de API toch onbalans_export, dan telt die).
      # Terugval als de TenneT-bron niet werkt.
      - name: "BEVCC Balans exportprijs"
        unique_id: bevcc_balans_exportprijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-refund
        availability: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set ns = namespace(kaal=none) %}
          {% for p in data.get('prices', []) if p.start <= nu < p.end %}
            {% set dirs = data.get('afrrDiscovery', []) | selectattr('start', 'eq', p.start)
                          | map(attribute='directions') | first | default([], true) %}
            {% set v = p.get('values') or {} %}
            {% set afrr = v.get('afrr_export') if 'export' in dirs else none %}
            {% set ns.kaal = afrr if afrr is number else v.get('onbalans_export') %}
          {% endfor %}
          {{ ns.kaal is number }}
        value_template: >-
          {% set nu = (as_timestamp(now()) * 1000) | int %}
          {% set data = value_json if value_json is defined and value_json is mapping else {} %}
          {% set ns = namespace(kaal=none) %}
          {% for p in data.get('prices', []) if p.start <= nu < p.end %}
            {% set dirs = data.get('afrrDiscovery', []) | selectattr('start', 'eq', p.start)
                          | map(attribute='directions') | first | default([], true) %}
            {% set v = p.get('values') or {} %}
            {% set afrr = v.get('afrr_export') if 'export' in dirs else none %}
            {% set ns.kaal = afrr if afrr is number else v.get('onbalans_export') %}
          {% endfor %}
          {{ ns.kaal | round(5) if ns.kaal is number else none }}

  # Nieuwste BEVCC-versie op GitHub (elke 6 uur), voor de update-melding.
  - resource: https://api.github.com/repos/Freekers/BEVCC/releases/latest
    headers:
      Accept: application/vnd.github+json
      User-Agent: BEVCC-Home-Assistant
    scan_interval: 21600
    timeout: 20
    sensor:
      - name: "BEVCC laatste versie"
        unique_id: bevcc_laatste_versie
        icon: mdi:github
        availability: >-
          {{ value_json is defined and value_json is mapping and 'tag_name' in value_json }}
        value_template: "{{ value_json.tag_name | regex_replace('^v', '') }}"

command_line:
  # TenneT-onbalansprijzen per minuut (EUR/MWh), via services.tenergy.nl.
  # Toestand = 'Afnemen'; attributen afnemen, invoeden en tijd (HH:MM).
  - sensor:
      name: "BEVCC TenneT onbalans"
      unique_id: bevcc_tennet_onbalans
      unit_of_measurement: "EUR/MWh"
      icon: mdi:transmission-tower
      scan_interval: 60
      command_timeout: 30
      command: |
        curl -fsS --max-time 20 'https://services.tenergy.nl/public.aspx/actualimbalanceprices' | python3 -c "
        import sys, re, html, json
        h = sys.stdin.read()
        m = re.search(r'(<table[^>]*>.*?Invoeden.*?Afnemen.*?</table>)', h, flags=re.S | re.I)
        t = m.group(1) if m else h
        clean = lambda s: re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', html.unescape(s))).strip().replace('\u2212', '-').replace('\u2013', '-')
        num = r'-?\d[\d,\.]*'
        norm = lambda n: float(n.replace('.', '').replace(',', '.'))
        rows = re.findall(r'<tr[^>]*>.*?</tr>', t, flags=re.S | re.I)
        data = [[clean(c) for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, flags=re.S | re.I)] for r in rows]
        valid = [r for r in data if len(r) >= 9 and re.fullmatch(num, r[-1]) and re.fullmatch(num, r[-2]) and re.fullmatch(r'\d{1,2}:\d{2}', r[2])]
        print(json.dumps({'afnemen': norm(valid[0][-1]), 'invoeden': norm(valid[0][-2]), 'tijd': valid[0][2]}) if valid else '{}')
        "
      availability: >-
        {{ value_json is defined and value_json is mapping and value_json.get('afnemen') is number }}
      value_template: "{{ value_json.afnemen }}"
      json_attributes:
        - afnemen
        - invoeden
        - tijd

template:
  # ---------------------------------------------------------------------------
  # 2. EVCC-koppeling: de enige plek met EVCC-entiteiten. Opgebouwd uit
  #    bevcc_evcc_prefix en bevcc_evcc_laadpunt (secrets.yaml).
  #    EVCC-conventies: net + = afname, thuisaccu + = ontladen. kW wordt W.
  # ---------------------------------------------------------------------------
  - select:
      # Doorgeefluik naar select.<prefix>_<laadpunt>_mode.
      - name: "BEVCC EVCC-modus"
        unique_id: bevcc_evcc_modus
        icon: mdi:state-machine
        availability: >-
          {% set e = 'select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_mode' %}
          {{ states(e) not in ['unavailable', 'unknown'] }}
        state: >-
          {{ states('select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_mode') }}
        options: >-
          {{ state_attr('select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_mode', 'options') or [] }}
        select_option:
          - action: select.select_option
            target:
              entity_id: "select.{{ states('input_text.bevcc_evcc_prefix') }}_{{ states('input_text.bevcc_evcc_laadpunt') }}_mode"
            data:
              option: "{{ option }}"

      # Doorgeefluik naar select.<prefix>_<laadpunt>_max_current (ampère, opties
      # '1' t/m '64' vanaf de minimale stroom). Alleen voor de laadstroomregeling.
      - name: "BEVCC EVCC max. laadstroom"
        unique_id: bevcc_evcc_max_laadstroom
        icon: mdi:current-ac
        availability: >-
          {% set e = 'select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_max_current' %}
          {{ is_number(states(e)) }}
        state: >-
          {{ states('select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_max_current') }}
        options: >-
          {% set e = 'select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_max_current' %}
          {{ state_attr(e, 'options') or [] }}
        select_option:
          - action: select.select_option
            target:
              entity_id: "select.{{ states('input_text.bevcc_evcc_prefix') }}_{{ states('input_text.bevcc_evcc_laadpunt') }}_max_current"
            data:
              option: "{{ option }}"

  - binary_sensor:
      - name: "BEVCC auto aangesloten"
        unique_id: bevcc_auto_aangesloten
        device_class: plug
        availability: >-
          {% set e = 'binary_sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_connected' %}
          {{ states(e) in ['on', 'off'] }}
        state: >-
          {{ is_state('binary_sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_connected', 'on') }}

      - name: "BEVCC auto laadt"
        unique_id: bevcc_auto_laadt
        device_class: battery_charging
        availability: >-
          {% set e = 'binary_sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_charging' %}
          {{ states(e) in ['on', 'off'] }}
        state: >-
          {{ is_state('binary_sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_charging', 'on') }}

  - sensor:
      # + = afname van het net, - = teruglevering
      - name: "BEVCC net vermogen"
        unique_id: bevcc_net_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_grid_power')) }}"
        state: >-
          {% set e = 'sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_grid_power' %}
          {{ (states(e) | float * (1000 if state_attr(e, 'unit_of_measurement') == 'kW' else 1)) | round(0) }}

      # + = thuisaccu ontlaadt, - = laadt
      - name: "BEVCC thuisaccu vermogen"
        unique_id: bevcc_thuisaccu_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_battery_power')) }}"
        state: >-
          {% set e = 'sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_battery_power' %}
          {{ (states(e) | float * (1000 if state_attr(e, 'unit_of_measurement') == 'kW' else 1)) | round(0) }}

      # vermogen naar de auto, >= 0
      - name: "BEVCC laadvermogen"
        unique_id: bevcc_laadvermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_charge_power')) }}
        state: >-
          {% set e = 'sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_charge_power' %}
          {{ (states(e) | float * (1000 if state_attr(e, 'unit_of_measurement') == 'kW' else 1)) | round(0) }}

      - name: "BEVCC thuisaccu SoC"
        unique_id: bevcc_thuisaccu_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: "{{ is_number(states('sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_battery_soc')) }}"
        state: "{{ states('sensor.' ~ states('input_text.bevcc_evcc_prefix') ~ '_battery_soc') | float | round(1) }}"

      # Minimale laadstroom van het laadpunt in EVCC (A); lager kan EVCC niet.
      - name: "BEVCC min. laadstroom"
        unique_id: bevcc_min_laadstroom
        unit_of_measurement: "A"
        icon: mdi:current-ac
        availability: >-
          {{ is_number(states('select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_min_current')) }}
        state: >-
          {{ states('select.' ~ states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') ~ '_min_current') | float }}

      # Aantal fasen waarop de auto laadt (of gaat laden): de actieve fasen
      # tijdens het laden, anders de ingestelde fasen (1 of 3), anders 3.
      - name: "BEVCC laadfasen"
        unique_id: bevcc_laadfasen
        icon: mdi:sine-wave
        state: >-
          {% set lp = states('input_text.bevcc_evcc_prefix') ~ '_' ~ states('input_text.bevcc_evcc_laadpunt') %}
          {% set actief = states('sensor.' ~ lp ~ '_phases_active') | int(0) %}
          {% set ingesteld = states('select.' ~ lp ~ '_phases') | int(0) %}
          {{ actief if actief in [1, 2, 3] else (ingesteld if ingesteld in [1, 3] else 3) }}

  # ---------------------------------------------------------------------------
  # 3. Prijs voor de beslissingen
  #    Afnameprijs (pauze, dashboard): wat extra afname nu kost.
  #      Tijdens een aFRR-importsessie: TenneT 'Invoeden' (afregelprijs),
  #      anders de aFRR-prijs van Balans. Zonder sessie: TenneT 'Afnemen',
  #      anders de kwartierprijs van Balans (alleen nog bij dynamische
  #      import; zonder TenneT is er dan geen prijs). De dynamische prijs
  #      telt hier niet mee: dat volume is al ingekocht en het EMS houdt de
  #      netafname op het plan, dus een pauze bespaart daarop niets.
  #    Boostprijs: de afnameprijs, behalve in een kwartier met dynamische
  #      import zonder aFRR-sessie: dan de dynamische prijs.
  #    All-in = 1,21 x kaal + leverkosten + energiebelasting.
  #    Exportprijs (boost bij export): wat het EMS nu voor teruglevering
  #      krijgt. Tijdens een aFRR-exportsessie TenneT 'Afnemen' (opregelprijs),
  #      anders TenneT 'Invoeden'; terugval de exportprijs van Balans. Ook
  #      all-in, met dezelfde formule: zo zijn alle grenzen vergelijkbaar, en
  #      zolang je saldeert is een teruggeleverde kWh ongeveer zoveel waard.
  # ---------------------------------------------------------------------------
  - sensor:
      - name: "BEVCC afnameprijs"
        unique_id: bevcc_afnameprijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-clock
        availability: >-
          {% set t = 'sensor.bevcc_tennet_onbalans' %}
          {% set sessie = is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}
          {{ (has_value(t) and is_number(state_attr(t, 'afnemen')))
             or (sessie and (has_value(t) and is_number(state_attr(t, 'invoeden'))
                             or is_number(states('sensor.bevcc_balans_afrr_importprijs'))))
             or is_number(states('sensor.bevcc_balans_kwartierprijs')) }}
        state: >-
          {% set t = 'sensor.bevcc_tennet_onbalans' %}
          {% set sessie = is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}
          {% set invoeden = state_attr(t, 'invoeden') if has_value(t) else none %}
          {% set afnemen = state_attr(t, 'afnemen') if has_value(t) else none %}
          {% set afrr = states('sensor.bevcc_balans_afrr_importprijs') %}
          {% set eb = states('input_number.bevcc_energiebelasting') | float(0.11085) %}
          {% set leverkosten = states('input_number.bevcc_leverkosten') | float(0.02) %}
          {% if sessie and is_number(invoeden) %}{% set kaal = invoeden | float / 1000 %}
          {% elif sessie and is_number(afrr) %}{% set kaal = afrr | float %}
          {% elif is_number(afnemen) %}{% set kaal = afnemen | float / 1000 %}
          {% else %}{% set kaal = none %}{% endif %}
          {% if kaal is not none %}{{ (kaal * 1.21 + leverkosten + eb) | round(5) }}
          {% else %}{{ states('sensor.bevcc_balans_kwartierprijs') | float(0) }}{% endif %}
        attributes:
          # kale prijs in EUR/kWh, bijvoorbeeld voor het live tariefslot van EVCC
          kaal: >-
            {% set t = 'sensor.bevcc_tennet_onbalans' %}
            {% set sessie = is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}
            {% set invoeden = state_attr(t, 'invoeden') if has_value(t) else none %}
            {% set afnemen = state_attr(t, 'afnemen') if has_value(t) else none %}
            {% set afrr = states('sensor.bevcc_balans_afrr_importprijs') %}
            {% if sessie and is_number(invoeden) %}{{ (invoeden | float / 1000) | round(5) }}
            {% elif sessie and is_number(afrr) %}{{ afrr | float | round(5) }}
            {% elif is_number(afnemen) %}{{ (afnemen | float / 1000) | round(5) }}
            {% else %}{{ none }}{% endif %}

      - name: "BEVCC prijsbron"
        unique_id: bevcc_prijsbron
        icon: mdi:source-branch
        state: >-
          {% set t = 'sensor.bevcc_tennet_onbalans' %}
          {% set sessie = is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}
          {% if sessie and has_value(t) and is_number(state_attr(t, 'invoeden')) %}aFRR-import (afregelprijs)
          {% elif sessie and is_number(states('sensor.bevcc_balans_afrr_importprijs')) %}aFRR-import (Balans)
          {% elif has_value(t) and is_number(state_attr(t, 'afnemen')) %}onbalans (TenneT afnemen)
          {% elif is_number(states('sensor.bevcc_balans_kwartierprijs')) %}Balans kwartierprijs
          {% else %}onbekend{% endif %}

      # Prijs voor de boostbeslissing (all-in). Gelijk aan de afnameprijs,
      # behalve in een kwartier met dynamische import zonder aFRR-sessie:
      # dan krijgt de auto stroom uit het dynamische volume, tegen de
      # dynamische prijs. In een kwartier met dynamisch + aFRR geldt de
      # aFRR-prijs: de sessie is de goedkope import die de boost waard is.
      - name: "BEVCC boostprijs"
        unique_id: bevcc_boostprijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-fast
        availability: >-
          {{ is_number(states('sensor.bevcc_afnameprijs'))
             or is_number(states('sensor.bevcc_balans_dynamisch_prijs')) }}
        state: >-
          {% set dyn = states('sensor.bevcc_balans_dynamisch_prijs') %}
          {% if is_number(dyn) and not is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}
            {% set eb = states('input_number.bevcc_energiebelasting') | float(0.11085) %}
            {% set leverkosten = states('input_number.bevcc_leverkosten') | float(0.02) %}
            {{ (dyn | float * 1.21 + leverkosten + eb) | round(5) }}
          {% else %}{{ states('sensor.bevcc_afnameprijs') }}{% endif %}
        attributes:
          bron: >-
            {% if is_number(states('sensor.bevcc_balans_dynamisch_prijs'))
                  and not is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}dynamisch (day-ahead)
            {% else %}{{ states('sensor.bevcc_prijsbron') }}{% endif %}

      # All-in prijs die het EMS nu voor teruglevering krijgt (EUR/kWh), voor
      # een boost bij export (attribuut 'kaal': de kale prijs). Zelfde formule
      # als de afnameprijs. Een aFRR-exportsessie is opregelen: afgerekend tegen
      # de opregelprijs, de kolom 'Afnemen' (in de bekeken gegevens was de
      # aFRR-exportprijs van elk sessiekwartier gelijk aan onbalans_import).
      # Die kan binnen het kwartier alleen nog stijgen. Andere teruglevering:
      # 'Invoeden'. Tijdens een dynamisch exportplan is de prijs onbekend.
      - name: "BEVCC exportprijs"
        unique_id: bevcc_exportprijs
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-refund
        availability: >-
          {% set t = 'sensor.bevcc_tennet_onbalans' %}
          {% set kolom = 'afnemen' if is_state('binary_sensor.bevcc_afrr_exportsessie', 'on') else 'invoeden' %}
          {{ not is_state('binary_sensor.bevcc_dynamische_export', 'on')
             and ((has_value(t) and is_number(state_attr(t, kolom)))
                  or is_number(states('sensor.bevcc_balans_exportprijs'))) }}
        state: >-
          {% set t = 'sensor.bevcc_tennet_onbalans' %}
          {% set kolom = 'afnemen' if is_state('binary_sensor.bevcc_afrr_exportsessie', 'on') else 'invoeden' %}
          {% set live = state_attr(t, kolom) if has_value(t) else none %}
          {% set kaal = live | float / 1000 if is_number(live) else states('sensor.bevcc_balans_exportprijs') | float(0) %}
          {% set eb = states('input_number.bevcc_energiebelasting') | float(0.11085) %}
          {% set leverkosten = states('input_number.bevcc_leverkosten') | float(0.02) %}
          {{ (kaal * 1.21 + leverkosten + eb) | round(5) }}
        attributes:
          kaal: >-
            {% set t = 'sensor.bevcc_tennet_onbalans' %}
            {% set kolom = 'afnemen' if is_state('binary_sensor.bevcc_afrr_exportsessie', 'on') else 'invoeden' %}
            {% set live = state_attr(t, kolom) if has_value(t) else none %}
            {% set balans = states('sensor.bevcc_balans_exportprijs') %}
            {% if is_number(live) %}{{ (live | float / 1000) | round(5) }}
            {% elif is_number(balans) %}{{ balans | float | round(5) }}
            {% else %}{{ none }}{% endif %}
          bron: >-
            {% set t = 'sensor.bevcc_tennet_onbalans' %}
            {% set sessie = is_state('binary_sensor.bevcc_afrr_exportsessie', 'on') %}
            {% if is_state('binary_sensor.bevcc_dynamische_export', 'on') %}dynamische export (prijs onbekend)
            {% elif has_value(t) and is_number(state_attr(t, 'afnemen' if sessie else 'invoeden')) %}
              {{- 'aFRR-export (TenneT afnemen)' if sessie else 'onbalans (TenneT invoeden)' -}}
            {% elif is_number(states('sensor.bevcc_balans_exportprijs')) %}
              {{- 'aFRR-export (Balans)' if sessie else 'Balans kwartierprijs export' -}}
            {% else %}onbekend{% endif %}

  # ---------------------------------------------------------------------------
  # 4. Voorwaarden
  # ---------------------------------------------------------------------------
  - binary_sensor:
      # Direct aan boven 'Pauze boven'; uit na 2 min onder 'Pauze boven' - 0,02.
      - name: "BEVCC prijspiek"
        unique_id: bevcc_prijspiek
        icon: mdi:flash-alert
        availability: "{{ is_number(states('sensor.bevcc_afnameprijs')) }}"
        delay_off: "00:02:00"
        state: >-
          {% set p = states('sensor.bevcc_afnameprijs') | float(0) %}
          {% set cap = states('input_number.bevcc_pauze_boven') | float(0.35) %}
          {{ p > cap or (p >= cap - 0.02 and this.state == 'on') }}

      # EMS importeert nu: de thuisaccu laadt en de netafname zonder de auto
      # ligt boven de minimale EMS-import. Pas na 90 s aan, zodat korte pulsen
      # zonder aFRR-sessie van Balans genegeerd worden.
      - name: "BEVCC EMS-import"
        unique_id: bevcc_ems_import
        icon: mdi:home-import-outline
        delay_on: "00:01:30"
        state: >-
          {% set min_import = states('input_number.bevcc_boost_min_import') | float(2) * 1000 %}
          {% set net = states('sensor.bevcc_net_vermogen') | float(0) %}
          {% set accu = states('sensor.bevcc_thuisaccu_vermogen') | float(0) %}
          {% set auto = states('sensor.bevcc_laadvermogen') | float(0) %}
          {{ accu < -500 and net - auto > min_import }}

      # Start: thuisaccu op of boven de ondergrens, het EMS importeert nu, de
      # boostprijs ligt onder 'Boost onder', en
      #   - Balans meldt een aFRR-importsessie (direct - de sessie bewijst dat
      #     de import echt is), of
      #   - bij 'Boost bij' = 'aFRR + dynamisch' of 'aFRR + onbalans': het is
      #     een kwartier met dynamische import (ook direct), of
      #   - alleen bij 'Boost bij' = 'aFRR + onbalans': de import duurt al 90 s.
      # Doorgaan zolang:
      #   - de prijs onder 'Boost onder' + 0,02 blijft, en
      #   - de netafname boven 'Boost min. EMS-vermogen' - 1 kW blijft (minimaal
      #     0 kW). Hier telt de auto wel mee: tijdens een import houdt het EMS
      #     vaak het netvermogen vast en laadt de accu minder zodra de auto
      #     start. Zakt de netafname hieronder, dan voedt vooral de thuisaccu
      #     de auto en is de goedkope import (grotendeels) voorbij, en
      #   - de thuisaccu boven de ondergrens - 2 % blijft (onbekend -> stop), en
      #   - bij 'alleen aFRR': de aFRR-importsessie nog loopt; bij
      #     'aFRR + dynamisch': de aFRR-sessie of de dynamische import nog loopt.
      # Met 'laadstroom regelen' (en een regelbaar laadpunt) daarnaast:
      #   - start alleen als de auto minstens op zijn minimale laadstroom kan
      #     laden met wat er naar de thuisaccu gaat (anders ontlaadt de accu
      #     ook bij de laagste stroom), en
      #   - stop als de thuisaccu toch meer dan 1 kW ontlaadt (2 min): de
      #     import dekt de auto niet meer, ook niet op de laagste stroom.
      # 2 min uitstelvertraging tegen korte dips, 5 min rust na een boost (de boost
      # verandert zelf de vermogens die hier gemeten worden; zonder rust kan hij
      # blijven aan- en uitgaan).
      # Prijs onbekend -> geen boost. 'Boost bij goedkope import' uit -> geen
      # boost, en een lopende boost stopt (na 2 min). 'Boost onder' mag
      # negatief zijn: alleen boosten als je betaald krijgt om af te nemen.
      - name: "BEVCC goedkope import"
        unique_id: bevcc_goedkope_import
        icon: mdi:transmission-tower-import
        delay_off: "00:02:00"
        state: >-
          {% set prijs = states('sensor.bevcc_boostprijs') | float(99) %}
          {% set aan = is_state('input_boolean.bevcc_boost_import', 'on') %}
          {% set grens = states('input_number.bevcc_boost_onder') | float(0.20) %}
          {% set min_import = states('input_number.bevcc_boost_min_import') | float(2) * 1000 %}
          {% set ondergrens = states('input_number.bevcc_accu_ondergrens') | float(0) %}
          {% set soc = states('sensor.bevcc_thuisaccu_soc') | float(0) %}
          {% set net = states('sensor.bevcc_net_vermogen') | float(0) %}
          {% set accu = states('sensor.bevcc_thuisaccu_vermogen') | float(0) %}
          {% set auto = states('sensor.bevcc_laadvermogen') | float(0) %}
          {% set sessie = is_state('binary_sensor.bevcc_afrr_importsessie', 'on') %}
          {% set bij = states('input_select.bevcc_boost_bij') %}
          {% set ook_onbalans = bij == 'aFRR + onbalans' %}
          {% set ook_dynamisch = bij in ['aFRR + dynamisch', 'aFRR + onbalans'] %}
          {% set dynamisch = ook_dynamisch and is_number(states('sensor.bevcc_balans_dynamisch_prijs')) %}
          {% set regelen = is_state('input_boolean.bevcc_laadstroom_regelen', 'on')
                           and is_number(states('select.bevcc_evcc_max_laadstroom'))
                           and states('input_text.bevcc_ingestelde_stroom') != 'handmatig' %}
          {% set min_laden = [states('sensor.bevcc_min_laadstroom') | float(6), 1] | max * 230
                             * states('sensor.bevcc_laadfasen') | int(3) %}
          {% if this.state == 'on' %}
            {{ aan and prijs < grens + 0.02 and net > [min_import - 1000, 0] | max
               and soc >= ondergrens - 2 and (sessie or dynamisch or ook_onbalans)
               and (not regelen or accu <= 1000) }}
          {% else %}
            {{ aan and prijs < grens and soc >= ondergrens and accu < -500 and net - auto > min_import
               and (sessie or dynamisch or (ook_onbalans and is_state('binary_sensor.bevcc_ems_import', 'on')))
               and (not regelen or auto - accu - 300 >= min_laden)
               and now() - this.last_changed > timedelta(minutes=5) }}
          {% endif %}

      # EMS levert terug: de thuisaccu ontlaadt en het net krijgt (met de auto)
      # meer dan 'Boost min. EMS-vermogen'. Met de auto: buiten de handel dekt
      # het EMS het verbruik van huis en auto uit de thuisaccu (net ~0); dat is
      # geen teruglevering. Pas na 90 s aan, zodat korte pulsen zonder
      # aFRR-exportsessie genegeerd worden.
      - name: "BEVCC EMS-export"
        unique_id: bevcc_ems_export
        icon: mdi:home-export-outline
        delay_on: "00:01:30"
        state: >-
          {% set min_export = states('input_number.bevcc_boost_min_import') | float(2) * 1000 %}
          {% set net = states('sensor.bevcc_net_vermogen') | float(0) %}
          {% set accu = states('sensor.bevcc_thuisaccu_vermogen') | float(0) %}
          {{ accu > 500 and net < - min_export }}

      # Boost bij export: het EMS verkoopt stroom uit de thuisaccu voor een
      # all-in prijs op of onder 'Boost bij export onder'; dan liever de auto
      # laden. Start als:
      #   - 'Boost bij goedkope export' aan staat en de exportprijs op of
      #     onder de grens ligt (de grens mag negatief zijn),
      #   - de thuisaccu met meer dan 500 W ontlaadt en het net (met de auto)
      #     meer dan 'Boost min. EMS-vermogen' terugkrijgt,
      #   - Balans een aFRR-exportsessie meldt (direct), of de teruglevering al
      #     90 s duurt,
      #   - de thuisaccu op of boven de ondergrens zit (tenzij genegeerd), en
      #   - de vorige boost bij export 5 min geleden eindigde.
      # Doorgaan zolang de prijs op of onder de grens + 0,02 blijft, het net
      # (met de auto) nog meer dan 200 W terugkrijgt, en de thuisaccu boven de
      # ondergrens - 2 % blijft (tenzij genegeerd).
      # Waarom 200 W: tijdens een teruglevering dekt de thuisaccu ook de auto,
      # tot het maximum van de omvormer; daarboven gaat de auto ten koste van
      # de teruglevering. Buiten de handel dekt het EMS de auto ook uit de
      # thuisaccu, maar levert het niets terug. Op de meters is dat alleen te
      # onderscheiden zolang er nog wat teruglevering over is; zakt die 2 min
      # onder 200 W, dan stopt de boost (met 'laadstroom regelen' laat de
      # regeling minstens 300 W over).
      # Tijdens een dynamisch exportplan is de prijs onbekend: geen boost.
      - name: "BEVCC goedkope export"
        unique_id: bevcc_goedkope_export
        icon: mdi:transmission-tower-export
        delay_off: "00:02:00"
        state: >-
          {% set prijs = states('sensor.bevcc_exportprijs') | float(99) %}
          {% set aan = is_state('input_boolean.bevcc_boost_export', 'on') %}
          {% set grens = states('input_number.bevcc_boost_export_onder') | float(0.30) %}
          {% set min_export = states('input_number.bevcc_boost_min_import') | float(2) * 1000 %}
          {% set negeer = is_state('input_boolean.bevcc_boost_export_negeer_ondergrens', 'on') %}
          {% set ondergrens = states('input_number.bevcc_accu_ondergrens') | float(0) %}
          {% set soc = states('sensor.bevcc_thuisaccu_soc') | float(0) %}
          {% set net = states('sensor.bevcc_net_vermogen') | float(0) %}
          {% set accu = states('sensor.bevcc_thuisaccu_vermogen') | float(0) %}
          {% set sessie = is_state('binary_sensor.bevcc_afrr_exportsessie', 'on') %}
          {% if this.state == 'on' %}
            {{ aan and prijs <= grens + 0.02 and net < -200
               and (negeer or soc >= ondergrens - 2) }}
          {% else %}
            {{ aan and prijs <= grens and (negeer or soc >= ondergrens)
               and accu > 500 and net < - min_export
               and (sessie or is_state('binary_sensor.bevcc_ems_export', 'on'))
               and now() - this.last_changed > timedelta(minutes=5) }}
          {% endif %}

  # ---------------------------------------------------------------------------
  # 5. Besluit: waar de EVCC-modus nu naartoe moet (geen / pauze / boost)
  # ---------------------------------------------------------------------------
  - sensor:
      # Pauze alleen terwijl de auto echt laadt. Prijs weggevallen: een
      # lopende pauze blijft 15 min staan en valt dan open (EVCC neemt over).
      - name: "BEVCC doel"
        unique_id: bevcc_doel
        icon: mdi:target
        state: >-
          {% set status = states('input_select.bevcc_status') %}
          {% set s = states.binary_sensor.bevcc_prijspiek %}
          {% set piek = s is not none and (s.state == 'on'
               or (s.state in ['unavailable', 'unknown'] and status == 'pauze'
                   and now() - s.last_changed < timedelta(minutes=15))) %}
          {% if not is_state('input_boolean.bevcc_standaardwaarden', 'on') %}geen
          {% elif not is_state('binary_sensor.bevcc_auto_aangesloten', 'on') %}geen
          {% elif piek and (is_state('binary_sensor.bevcc_auto_laadt', 'on') or status == 'pauze') %}pauze
          {% elif is_state('binary_sensor.bevcc_goedkope_import', 'on')
                  or is_state('binary_sensor.bevcc_goedkope_export', 'on') %}boost
          {% else %}geen{% endif %}
        attributes:
          # waarom een boost: 'import' (goedkope EMS-import) of 'export'
          # (goedkope teruglevering); leeg zonder boostvoorwaarde
          reden: >-
            {% if is_state('binary_sensor.bevcc_goedkope_import', 'on') %}import
            {% elif is_state('binary_sensor.bevcc_goedkope_export', 'on') %}export
            {% else %}{% endif %}

      # Laadstroomregeling: de maximale laadstroom (A) die de auto nu mag
      # hebben. Alleen tijdens een boost met 'laadstroom regelen' aan, anders
      # onbekend. De auto krijgt wat hij nu laadt plus de ruimte:
      #   import: wat er nu naar de thuisaccu gaat, min 300 W marge. Houdt het
      #           EMS de netafname vast, dan laadt de thuisaccu daardoor nog
      #           net, in plaats van de auto te voeden.
      #   export: wat er nu nog naar het net gaat, min 300 W marge (net boven
      #           de 200 W waarop de boost stopt). Zolang de thuisaccu onder
      #           het maximum van de omvormer blijft, geeft dit de volle
      #           stroom; daarboven neemt de auto de teruglevering over, op
      #           300 W na (zie 'BEVCC goedkope export').
      # Afgerond naar beneden op hele ampère (230 V per fase), tussen de
      # minimale stroom van EVCC en de oorspronkelijke maximale stroom.
      # Omlaag direct, omhoog pas bij 300 W extra ruimte: zo springt de stroom
      # niet heen en weer als de meting rond een ampèregrens schommelt.
      - name: "BEVCC laadstroom doel"
        unique_id: bevcc_laadstroom_doel
        unit_of_measurement: "A"
        icon: mdi:current-ac
        availability: >-
          {{ is_number(states('select.bevcc_evcc_max_laadstroom'))
             or is_number(states('input_text.bevcc_te_herstellen_stroom')) }}
        state: >-
          {% set bewaard = states('input_text.bevcc_te_herstellen_stroom') %}
          {% set max_a = (bewaard if is_number(bewaard) else states('select.bevcc_evcc_max_laadstroom')) | float(0) %}
          {% set min_a = [states('sensor.bevcc_min_laadstroom') | float(6), 1] | max %}
          {% set fasen = states('sensor.bevcc_laadfasen') | int(3) %}
          {% set export = is_state('binary_sensor.bevcc_goedkope_export', 'on')
                          and not is_state('binary_sensor.bevcc_goedkope_import', 'on') %}
          {% set meting = states('sensor.bevcc_net_vermogen' if export else 'sensor.bevcc_thuisaccu_vermogen') %}
          {% if is_state('input_select.bevcc_status', 'boost') and is_state('input_boolean.bevcc_laadstroom_regelen', 'on')
                and is_number(meting) and max_a >= 1 %}
            {% set w = 230 * fasen %}
            {% set beschikbaar = states('sensor.bevcc_laadvermogen') | float(0) - (meting | float) - 300 %}
            {% set huidig = states('select.bevcc_evcc_max_laadstroom') | float(0) %}
            {% set doel = (beschikbaar / w) | round(0, 'floor') %}
            {% if doel > huidig %}{% set doel = [huidig, ((beschikbaar - 300) / w) | round(0, 'floor')] | max %}{% endif %}
            {{ [[doel, max_a] | min, min_a | round(0, 'ceil')] | max | int }}
          {% else %}{{ none }}{% endif %}
        attributes:
          reden: >-
            {{ 'export' if is_state('binary_sensor.bevcc_goedkope_export', 'on')
                           and not is_state('binary_sensor.bevcc_goedkope_import', 'on') else 'import' }}
          fasen: "{{ states('sensor.bevcc_laadfasen') | int(3) }}"
          oorspronkelijk: >-
            {% set bewaard = states('input_text.bevcc_te_herstellen_stroom') %}
            {{ (bewaard if is_number(bewaard) else states('select.bevcc_evcc_max_laadstroom')) | int(0) }}

      - name: "BEVCC versie"
        unique_id: bevcc_versie
        icon: mdi:tag
        state: "1.4.0"

  - binary_sensor:
      - name: "BEVCC update beschikbaar"
        unique_id: bevcc_update_beschikbaar
        device_class: update
        # Aan zolang de nieuwste release op GitHub nieuwer is dan de geïnstalleerde
        # versie; gaat vanzelf uit na het bijwerken (bestand vervangen + herstart).
        # Versies vergeleken als getallen (1.10.0 > 1.9.0); '-beta' e.d. genegeerd.
        # Is GitHub even onbereikbaar, dan geldt de laatst bekende release, zodat
        # de melding niet verdwijnt en terugkomt.
        state: >-
          {% set n = states('sensor.bevcc_laatste_versie') %}
          {% set nieuw = n if n not in ['unknown', 'unavailable', ''] else this.attributes.get('laatste_versie', '') %}
          {% set huidig = states('sensor.bevcc_versie') %}
          {% if not nieuw %}false
          {% else %}
            {{ nieuw.split('-')[0].split('.') | map('int', 0) | list
               > huidig.split('-')[0].split('.') | map('int', 0) | list }}
          {% endif %}
        attributes:
          laatste_versie: >-
            {% set n = states('sensor.bevcc_laatste_versie') %}
            {{ n if n not in ['unknown', 'unavailable', ''] else this.attributes.get('laatste_versie', '') }}

# -----------------------------------------------------------------------------
# 6. Automatiseringen
# -----------------------------------------------------------------------------
automation:
  # Zet het doel om in de EVCC-modus
  - id: bevcc_prijssturing
    alias: "BEVCC prijssturing"
    description: >-
      Zet de EVCC-modus op Uit bij een prijspiek, op Snel bij goedkope
      EMS-import, en daarna terug naar de modus die er stond.
    mode: queued
    max: 10
    max_exceeded: silent
    triggers:
      - trigger: state
        id: doel
        entity_id: sensor.bevcc_doel
      # Modus veranderd en 30 s stabiel: overname door de gebruiker of herstart
      - trigger: state
        id: modus
        entity_id: select.bevcc_evcc_modus
        for: "00:00:30"
      # 1 min na pauze/boost: controleren of EVCC meeging
      - trigger: state
        id: controle
        entity_id: input_select.bevcc_status
        to: ["pauze", "boost"]
        for: "00:01:00"
      # Vangnet voor gemiste triggers
      - trigger: time_pattern
        id: tik
        minutes: "/5"
      - trigger: homeassistant
        id: start
        event: start

    actions:
      # Toestand lezen bij de start van de run (runs kunnen in de wachtrij staan)
      - variables:
          doel: "{{ states('sensor.bevcc_doel') }}"
          status: "{{ states('input_select.bevcc_status') }}"
          modus: "{{ states('select.bevcc_evcc_modus') }}"
          # De API-waarde van EVCC's modus Snel is 'now' ('Snel'/'Fast' is
          # alleen het label). Alleen 'fast' als de select dat echt aanbiedt.
          snel: >-
            {% set o = state_attr('select.bevcc_evcc_modus', 'options') or [] %}
            {{ 'fast' if 'fast' in o and 'now' not in o else 'now' }}
          bewaard: >-
            {% set m = states('input_text.bevcc_te_herstellen_modus') %}
            {{ m if m in ['smart', snel] else 'smart' }}
          verwacht: "{{ {'pauze': 'off', 'boost': snel}.get(status, '') }}"
          modus_na_status: >-
            {% set m = states.select.bevcc_evcc_modus %}
            {{ m is not none and m.last_changed > states.input_select.bevcc_status.last_changed }}
          reden: "{{ state_attr('sensor.bevcc_doel', 'reden') or 'import' }}"
          info: >-
            prijs € {{ states('sensor.bevcc_afnameprijs') }}/kWh ({{ states('sensor.bevcc_prijsbron') }}),
            net {{ states('sensor.bevcc_net_vermogen') }} W,
            thuisaccu {{ states('sensor.bevcc_thuisaccu_vermogen') }} W / {{ states('sensor.bevcc_thuisaccu_soc') }} %,
            auto {{ states('sensor.bevcc_laadvermogen') }} W

      - choose:
          # A) Onze modus is niet bij EVCC aangekomen
          - conditions:
              - condition: trigger
                id: controle
              - "{{ status in ['pauze', 'boost'] and modus != verwacht and not modus_na_status }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.bevcc_status
                data:
                  option: rust
              - action: logbook.log
                data:
                  name: BEVCC
                  message: "Modus '{{ verwacht }}' is NIET overgenomen, staat nog op '{{ modus }}'. Nieuwe poging binnen 5 min."
                  entity_id: select.bevcc_evcc_modus
              - action: persistent_notification.create
                data:
                  notification_id: bevcc_modus_mislukt
                  title: BEVCC
                  message: >-
                    De EVCC-modus staat na 1 minuut nog op '{{ modus }}' in plaats van
                    '{{ verwacht }}'. Controleer de EVCC-integratie.

          # B1) Modus kwam terug uit 'unavailable' anders dan de onze
          #     (herladen integratie / herstart EVCC) -> opnieuw instellen
          - conditions:
              - condition: trigger
                id: modus
              - "{{ status in ['pauze', 'boost'] and modus in ['off', 'smart', snel] and modus != verwacht
                    and trigger.from_state.state in ['unavailable', 'unknown'] }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: select.bevcc_evcc_modus
                data:
                  option: "{{ verwacht }}"
              - action: logbook.log
                data:
                  name: BEVCC
                  message: "EVCC kwam terug op '{{ modus }}' tijdens {{ status }}; opnieuw '{{ verwacht }}' ingesteld"
                  entity_id: select.bevcc_evcc_modus

          # B2) Modus door iemand anders gewijzigd tijdens pauze/boost -> opzij
          - conditions:
              - condition: trigger
                id: modus
              - "{{ status in ['pauze', 'boost'] and modus in ['off', 'smart', snel] and modus != verwacht
                    and modus_na_status }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.bevcc_status
                data:
                  option: handmatig
              - action: logbook.log
                data:
                  name: BEVCC
                  message: "Modus handmatig op '{{ modus }}' gezet tijdens {{ status }}; BEVCC wacht tot {{ doel }} voorbij is"
                  entity_id: select.bevcc_evcc_modus

          # C) Handmatige overname eindigt samen met de situatie die erbij hoorde
          - conditions:
              - "{{ status == 'handmatig' and doel == 'geen' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.bevcc_status
                data:
                  option: rust

          # D) Pauze (vanuit Smart, Snel of een lopende boost)
          - conditions:
              - "{{ doel == 'pauze'
                    and ((status == 'rust' and modus in ['smart', snel]) or status == 'boost') }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ status == 'rust' }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.bevcc_te_herstellen_modus
                    data:
                      value: "{{ modus }}"
              - action: input_select.select_option
                target:
                  entity_id: input_select.bevcc_status
                data:
                  option: pauze
              - action: select.select_option
                target:
                  entity_id: select.bevcc_evcc_modus
                data:
                  option: "off"
              - action: logbook.log
                data:
                  name: BEVCC
                  message: "Gepauzeerd (prijspiek): {{ info }}; daarna terug naar '{{ modus if status == 'rust' else bewaard }}'"
                  entity_id: select.bevcc_evcc_modus

          # E) Boost (alleen vanuit Smart)
          - conditions:
              - "{{ doel == 'boost'
                    and ((status == 'rust' and modus == 'smart') or (status == 'pauze' and bewaard == 'smart')) }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ status == 'rust' }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.bevcc_te_herstellen_modus
                    data:
                      value: smart
              - action: input_select.select_option
                target:
                  entity_id: input_select.bevcc_status
                data:
                  option: boost
              - action: select.select_option
                target:
                  entity_id: select.bevcc_evcc_modus
                data:
                  option: "{{ snel }}"
              - action: logbook.log
                data:
                  name: BEVCC
                  message: >-
                    {% if reden == 'export' %}Boost (goedkope teruglevering, exportprijs € {{ states('sensor.bevcc_exportprijs') }}/kWh,
                    {{ state_attr('sensor.bevcc_exportprijs', 'bron') }}){% else %}Boost (goedkope EMS-import,
                    boostprijs € {{ states('sensor.bevcc_boostprijs') }}/kWh,
                    {{ state_attr('sensor.bevcc_boostprijs', 'bron') }}){% endif %}: {{ info }}; daarna terug naar 'smart'
                  entity_id: select.bevcc_evcc_modus

          # F) Vrijgeven: situatie voorbij (of een boost tijdens een pauze vanuit Snel)
          - conditions:
              - "{{ status in ['pauze', 'boost']
                    and (doel == 'geen' or (doel == 'boost' and status == 'pauze')) }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.bevcc_status
                data:
                  option: rust
              # Alleen terugzetten als de modus nog de onze is (of EVCC even
              # weg is). Gecontroleerd: tot 1 min wachten tot de modus wijzigt,
              # max. 3 pogingen, dan een melding. Kiest de gebruiker intussen
              # zelf een modus, dan blijft die staan.
              # In het slechtste geval (EVCC onbereikbaar) duurt dit 3 min;
              # andere triggers wachten in de rij.
              - if:
                  - condition: template
                    value_template: "{{ modus in [verwacht, 'unavailable', 'unknown'] }}"
                then:
                  - repeat:
                      sequence:
                        - action: select.select_option
                          continue_on_error: true
                          target:
                            entity_id: select.bevcc_evcc_modus
                          data:
                            option: "{{ bewaard }}"
                        - wait_template: >-
                            {{ states('select.bevcc_evcc_modus') not in [verwacht, 'unavailable', 'unknown'] }}
                          timeout: "00:01:00"
                      until:
                        - "{{ wait.completed or repeat.index >= 3 }}"
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states('select.bevcc_evcc_modus') in [verwacht, 'unavailable', 'unknown'] }}
                    then:
                      - action: persistent_notification.create
                        data:
                          notification_id: bevcc_herstel_mislukt
                          title: BEVCC
                          message: >-
                            3 keer geprobeerd de EVCC-modus terug te zetten naar '{{ bewaard }}',
                            maar hij staat nog op '{{ states('select.bevcc_evcc_modus') }}'.
                            Zet de modus zelf in EVCC en controleer de EVCC-integratie.
              - action: logbook.log
                data:
                  name: BEVCC
                  message: "Vrijgegeven ({{ status }} -> {{ doel }}): {{ info }}; modus nu '{{ states('select.bevcc_evcc_modus') }}' (doel '{{ bewaard }}')"
                  entity_id: select.bevcc_evcc_modus

  # Laadstroomregeling: tijdens een boost met 'laadstroom regelen' aan de
  # maximale laadstroom van EVCC op sensor.bevcc_laadstroom_doel zetten, en na
  # de boost de oorspronkelijke waarde terugzetten. Net als bij de modus:
  # wijzigt iemand anders de maximale laadstroom tijdens de boost, dan stapt
  # BEVCC opzij en laat die waarde staan.
  - id: bevcc_laadstroomregeling
    alias: "BEVCC laadstroomregeling"
    description: >-
      Zet tijdens een boost de maximale laadstroom van EVCC zo dat de auto niet
      meer neemt dan de goedkope import levert, en daarna terug.
    mode: queued
    max: 3
    max_exceeded: silent
    triggers:
      # Regeling begint (boost start of schakelaar aan): direct
      - trigger: state
        id: begin
        entity_id: sensor.bevcc_laadstroom_doel
        from: ["unknown", "unavailable"]
      # Nieuw doel, 20 s stabiel (EVCC en de auto hebben tijd nodig)
      - trigger: state
        id: doel
        entity_id: sensor.bevcc_laadstroom_doel
        not_to: ["unknown", "unavailable"]
        for: "00:00:20"
      # Boost voorbij of schakelaar uit: terugzetten
      - trigger: state
        id: status
        entity_id: input_select.bevcc_status
      - trigger: state
        id: schakelaar
        entity_id: input_boolean.bevcc_laadstroom_regelen
      # Maximale laadstroom 1 min stabiel: handmatige wijziging herkennen
      - trigger: state
        id: stroom
        entity_id: select.bevcc_evcc_max_laadstroom
        not_to: ["unknown", "unavailable"]
        for: "00:01:00"
      # Vangnet (en nieuwe poging na een mislukt terugzetten)
      - trigger: time_pattern
        id: tik
        minutes: "/5"
      - trigger: homeassistant
        id: start
        event: start

    actions:
      - variables:
          actief: >-
            {{ is_state('input_select.bevcc_status', 'boost') and is_state('input_boolean.bevcc_laadstroom_regelen', 'on') }}
          huidig: "{{ states('select.bevcc_evcc_max_laadstroom') }}"
          doel: "{{ states('sensor.bevcc_laadstroom_doel') }}"
          bewaard: "{{ states('input_text.bevcc_te_herstellen_stroom') }}"
          ingesteld: "{{ states('input_text.bevcc_ingestelde_stroom') }}"
          # BEVCC zette de stroom meer dan een minuut geleden: EVCC had tijd
          ingesteld_oud: >-
            {% set s = states.input_text.bevcc_ingestelde_stroom %}
            {{ s is not none and now() - s.last_changed > timedelta(minutes=1) }}

      - choose:
          # A) Iemand anders wijzigde de maximale laadstroom tijdens de boost
          #    (of EVCC nam onze waarde niet over) -> opzij, niets terugzetten
          - conditions:
              - "{{ actief and is_number(ingesteld) and is_number(huidig)
                    and huidig | float != ingesteld | float and ingesteld_oud }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.bevcc_ingestelde_stroom
                data:
                  value: handmatig
              - action: input_text.set_value
                target:
                  entity_id: input_text.bevcc_te_herstellen_stroom
                data:
                  value: ""
              - action: logbook.log
                data:
                  name: BEVCC
                  message: >-
                    Maximale laadstroom staat op {{ huidig }} A in plaats van {{ ingesteld }} A (handmatig gewijzigd
                    of niet overgenomen door EVCC); BEVCC regelt de laadstroom niet meer tot de boost voorbij is
                  entity_id: select.bevcc_evcc_modus

          # B) Regelen: de maximale laadstroom naar het doel
          - conditions:
              - "{{ actief and ingesteld != 'handmatig' and is_number(doel) and is_number(huidig)
                    and doel | float != huidig | float }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ not is_number(bewaard) }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.bevcc_te_herstellen_stroom
                    data:
                      value: "{{ huidig | int }}"
                  - action: logbook.log
                    data:
                      name: BEVCC
                      message: >-
                        Laadstroom geregeld ({{ state_attr('sensor.bevcc_laadstroom_doel', 'reden') }}): maximaal
                        {{ huidig | int }} A -> {{ doel }} A bij {{ state_attr('sensor.bevcc_laadstroom_doel', 'fasen') }}
                        fase(n); net {{ states('sensor.bevcc_net_vermogen') }} W, thuisaccu
                        {{ states('sensor.bevcc_thuisaccu_vermogen') }} W, auto {{ states('sensor.bevcc_laadvermogen') }} W
                      entity_id: select.bevcc_evcc_modus
              # eerst onthouden, dan zetten: de controle in A rekent vanaf hier
              - action: input_text.set_value
                target:
                  entity_id: input_text.bevcc_ingestelde_stroom
                data:
                  value: "{{ doel | int }}"
              - action: select.select_option
                continue_on_error: true
                target:
                  entity_id: select.bevcc_evcc_max_laadstroom
                data:
                  option: "{{ doel | int }}"

          # C) Boost voorbij of regeling uit: oorspronkelijke waarde terug. Alleen
          #    als de stroom nog op de waarde van BEVCC staat; tot 1 min wachten,
          #    lukt het niet, dan een melding en een nieuwe poging bij de volgende
          #    tik (5 min).
          - conditions:
              - "{{ not actief and is_number(bewaard) and is_number(huidig) }}"
            sequence:
              - variables:
                  van_bevcc: "{{ huidig | float == ingesteld | float(-1) }}"
              - if:
                  - condition: template
                    value_template: "{{ van_bevcc and huidig | float != bewaard | float }}"
                then:
                  - action: select.select_option
                    continue_on_error: true
                    target:
                      entity_id: select.bevcc_evcc_max_laadstroom
                    data:
                      option: "{{ bewaard | int }}"
                  - wait_template: "{{ states('select.bevcc_evcc_max_laadstroom') | float(0) == bewaard | float }}"
                    timeout: "00:01:00"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not van_bevcc or states('select.bevcc_evcc_max_laadstroom') | float(0) == bewaard | float }}
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.bevcc_te_herstellen_stroom
                    data:
                      value: ""
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.bevcc_ingestelde_stroom
                    data:
                      value: ""
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: bevcc_laadstroom_herstel
                  - action: logbook.log
                    data:
                      name: BEVCC
                      message: >-
                        {% if van_bevcc %}Maximale laadstroom terug naar {{ bewaard | int }} A
                        {%- else %}Maximale laadstroom niet teruggezet: staat op {{ huidig }} A (handmatig gewijzigd){% endif %}
                      entity_id: select.bevcc_evcc_modus
                else:
                  - action: persistent_notification.create
                    data:
                      notification_id: bevcc_laadstroom_herstel
                      title: BEVCC
                      message: >-
                        De maximale laadstroom van EVCC staat na de boost nog op
                        {{ states('select.bevcc_evcc_max_laadstroom') }} A in plaats van {{ bewaard | int }} A.
                        BEVCC probeert het elke 5 minuten opnieuw. Controleer de EVCC-integratie, of zet de
                        maximale laadstroom zelf terug.

          # D) Opruimen na een handmatige wijziging
          - conditions:
              - "{{ not actief and ingesteld != '' and not is_number(bewaard) }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.bevcc_ingestelde_stroom
                data:
                  value: ""

  # Standaardwaarden: eenmalig na installatie, of opnieuw door
  # 'BEVCC standaardwaarden ingesteld' uit te zetten.
  # Na een update krijgen alleen nieuwe instellingen een beginwaarde (zie
  # input_text.bevcc_instellingen_versie); je eigen instellingen blijven staan.
  - id: bevcc_standaardwaarden
    alias: "BEVCC standaardwaarden"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      # ook na 'Automatiseringen herladen' (installatie zonder herstart)
      - trigger: event
        event_type: automation_reloaded
      - trigger: state
        entity_id: input_boolean.bevcc_standaardwaarden
        to: "off"
    conditions:
      - "{{ not is_state('input_boolean.bevcc_standaardwaarden', 'on')
            or states('input_text.bevcc_instellingen_versie') | int(0) < 2 }}"
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.bevcc_standaardwaarden
            state: "off"
        # Nieuwe installatie of herstellen: alles op de standaardwaarden
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_pauze_boven
            data:
              value: 0.35
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_boost_onder
            data:
              value: 0.20
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_boost_min_import
            data:
              value: 2
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_accu_ondergrens
            data:
              value: 50
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_energiebelasting
            data:
              value: 0.11085
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_leverkosten
            data:
              value: 0.02
          - action: input_number.set_value
            target:
              entity_id: input_number.bevcc_boost_export_onder
            data:
              value: 0.30
          - action: input_select.select_option
            target:
              entity_id: input_select.bevcc_boost_bij
            data:
              option: alleen aFRR
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bevcc_boost_import
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.bevcc_boost_export
                - input_boolean.bevcc_laadstroom_regelen
                - input_boolean.bevcc_boost_export_negeer_ondergrens
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bevcc_standaardwaarden
          - action: logbook.log
            data:
              name: BEVCC
              message: "Standaardwaarden ingesteld"
              entity_id: input_boolean.bevcc_standaardwaarden
        # Bijwerken van voor 1.4: boost had geen schakelaar, en 'Boost onder' op
        # -0,50 (het oude minimum) betekende uit. Wie boost aan had, houdt hem aan
        # met dezelfde grens. 'Boost bij export onder' is nieuw (alleen wie een
        # testversie gebruikte, kan al een positieve grens hebben).
        else:
          - variables:
              import_aan: "{{ states('input_number.bevcc_boost_onder') | float(0.20) > -0.5 }}"
              export_aan: "{{ states('input_number.bevcc_boost_export_onder') | float(-2) > 0 }}"
          - action: "input_boolean.turn_{{ 'on' if import_aan else 'off' }}"
            target:
              entity_id: input_boolean.bevcc_boost_import
          - action: "input_boolean.turn_{{ 'on' if export_aan else 'off' }}"
            target:
              entity_id: input_boolean.bevcc_boost_export
          - if:
              - "{{ not import_aan }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.bevcc_boost_onder
                data:
                  value: 0.20
          - if:
              - "{{ not export_aan }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.bevcc_boost_export_onder
                data:
                  value: 0.30
          - action: logbook.log
            data:
              name: BEVCC
              message: >-
                Instellingen bijgewerkt voor BEVCC 1.4: boost bij goedkope import
                {{ 'aan' if import_aan else 'uit' }}, boost bij goedkope export
                {{ 'aan' if export_aan else 'uit' }}
              entity_id: input_boolean.bevcc_standaardwaarden
      - action: input_text.set_value
        target:
          entity_id: input_text.bevcc_instellingen_versie
        data:
          value: "2"

  # Balans-API onbereikbaar (meestal een verlopen sessiecookie)
  - id: bevcc_balans_api_bewaking
    alias: "BEVCC Balans-API bewaking"
    mode: restart
    triggers:
      - trigger: state
        id: weg
        entity_id: binary_sensor.bevcc_afrr_importsessie
        to: "unavailable"
        for: "00:10:00"
      # al onbereikbaar bij het opstarten (bijvoorbeeld een verlopen cookie)
      - trigger: homeassistant
        id: start
        event: start
      - trigger: state
        id: terug
        entity_id: binary_sensor.bevcc_afrr_importsessie
        from: "unavailable"
    actions:
      - if:
          - condition: trigger
            id: terug
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: bevcc_balans_api
        else:
          - if:
              - condition: trigger
                id: start
            then:
              - delay: "00:10:00"
          - condition: state
            entity_id: binary_sensor.bevcc_afrr_importsessie
            state: "unavailable"
          - action: persistent_notification.create
            data:
              notification_id: bevcc_balans_api
              title: BEVCC - Balans-API niet bereikbaar
              message: >-
                De Balans-API geeft al 10 minuten geen gegevens. BEVCC ziet nu geen
                aFRR-importsessies en rekent met de TenneT-afnameprijs (te hoog tijdens
                een sessie), en boost alleen nog bij 'Boost bij' = 'aFRR + onbalans'.
                Een boost bij export rekent dan met de prijs 'Invoeden', ook tijdens een
                aFRR-exportsessie.
                Waarschijnlijk is de sessiecookie verlopen: log opnieuw in op
                dashboard.balansenergie.nl, zet de nieuwe Cookie-header in
                bevcc_balans_cookie in secrets.yaml en herlaad 'RESTful'
                (Ontwikkelhulpmiddelen → YAML).

  # Nieuwe BEVCC-versie beschikbaar. De melding verdwijnt vanzelf zodra de
  # nieuwe versie geïnstalleerd is; na wegklikken komt ze terug bij een
  # herstart of een nog nieuwere release.
  - id: bevcc_update_melding
    alias: "BEVCC update-melding"
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: binary_sensor.bevcc_update_beschikbaar
        to: ["on", "off"]
      # nog nieuwere release terwijl de vorige nog niet geïnstalleerd is
      - trigger: state
        entity_id: binary_sensor.bevcc_update_beschikbaar
        attribute: laatste_versie
      # meldingen overleven geen herstart
      - trigger: homeassistant
        event: start
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.bevcc_update_beschikbaar
            state: "on"
        then:
          - action: persistent_notification.create
            data:
              notification_id: bevcc_update
              title: BEVCC-update beschikbaar
              message: >-
                BEVCC {{ state_attr('binary_sensor.bevcc_update_beschikbaar', 'laatste_versie') }}
                is beschikbaar (geïnstalleerd: {{ states('sensor.bevcc_versie') }}). Lees de
                wijzigingen op https://github.com/Freekers/BEVCC/releases, vervang
                packages/bevcc.yaml (en eventueel de dashboardkaart) en herstart Home
                Assistant. Deze melding verdwijnt daarna vanzelf.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: bevcc_update
