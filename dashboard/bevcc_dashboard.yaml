# BEVCC - dashboardkaart
# Dashboard bewerken -> Kaart toevoegen -> Handmatig -> alles hieronder plakken.
# Werkt alleen samen met packages/bevcc.yaml.
type: vertical-stack
cards:
  # --- Kop: prijs, status, drempels ---
  - type: markdown
    content: |
      {% set p = states('sensor.bevcc_afnameprijs') %}
      {% set kaal = state_attr('sensor.bevcc_afnameprijs', 'kaal') %}
      {% set balans = states('sensor.bevcc_balans_kwartierprijs') %}
      {% set bp = states('sensor.bevcc_boostprijs') %}
      {% set cap = states('input_number.bevcc_pauze_boven') | float(0.35) %}
      {% set boost = states('input_number.bevcc_boost_onder') | float(0.20) %}
      {% set vast = states('input_number.bevcc_energiebelasting') | float(0.11085) + states('input_number.bevcc_leverkosten') | float(0.02) %}
      {% set vloer = states('input_number.bevcc_accu_ondergrens') | int(0) %}
      {% set min_kw = states('input_number.bevcc_boost_min_import') | float(2) %}
      {% set min_import = '%g' | format(min_kw) | replace('.', ',') %}
      {% set door_import = '%g' | format([min_kw - 1, 0] | max) | replace('.', ',') %}
      {% set bij = states('input_select.bevcc_boost_bij') %}
      {% set bronnen = {'aFRR + dynamisch': 'aFRR-sessie of dynamische import'}.get(bij, 'aFRR-sessie') %}
      {% set exp = states('input_number.bevcc_boost_export_onder') | float(-0.5) %}
      {% set ep = states('sensor.bevcc_exportprijs') %}
      {% set negeer = is_state('input_boolean.bevcc_boost_export_negeer_ondergrens', 'on') %}
      {% set regelen = is_state('input_boolean.bevcc_laadstroom_regelen', 'on') %}
      ## {{ ('€ %.3f' | format(p | float) | replace('.', ',')) if is_number(p) else 'prijs onbekend' }} /kWh · {{ states('input_select.bevcc_status') }}
      Bron: **{{ states('sensor.bevcc_prijsbron') }}**{% if is_number(kaal) %} (kaal € {{ '%.3f' | format(kaal | float) | replace('.', ',') }}){% endif %}
      {% if is_number(balans) %} · Balans kwartierprijs € {{ '%.3f' | format(balans | float) | replace('.', ',') }}{% endif %}
      {% if is_number(bp) and bp != p %} · boostprijs € {{ '%.3f' | format(bp | float) | replace('.', ',') }} ({{ state_attr('sensor.bevcc_boostprijs', 'bron') }}){% endif %}{% if exp > -0.5 and is_number(ep) %} · exportprijs € {{ '%.3f' | format(ep | float) | replace('.', ',') }} kaal ({{ state_attr('sensor.bevcc_exportprijs', 'bron') }}){% endif %}

      Pauze boven **€ {{ '%.2f' | format(cap) | replace('.', ',') }}** (≈ {{ ((cap - vast) / 1.21 * 1000) | round(0) | int }} €/MWh kaal), alleen terwijl de auto laadt ·
      {% if boost <= -0.5 %}boost staat **uit** (Boost onder op het minimum).
      {% else %}boost naar Snel onder **€ {{ '%.2f' | format(boost) | replace('.', ',') }}** (≈ {{ ((boost - vast) / 1.21 * 1000) | round(0) | int }} €/MWh kaal)
      {% if bij == 'aFRR + onbalans' %}als het EMS ≥ {{ min_import }} kW importeert (direct bij een aFRR-sessie of dynamische import, anders na 90 s){% else %}tijdens een {{ bronnen }} van ≥ {{ min_import }} kW{% endif %}
      en de thuisaccu ≥ {{ vloer }} % is.
      Terug naar Smart bij € {{ '%.2f' | format(boost + 0.02) | replace('.', ',') }} of hoger,{% if bij != 'aFRR + onbalans' %} als de {{ bronnen }} eindigt,{% endif %} als het net onder {{ door_import }} kW zakt
      of als de thuisaccu onder {{ vloer - 2 }} % komt{% if regelen %} of 2 min lang meer dan 1 kW ontlaadt{% endif %}.{% endif %}

      {% if exp > -0.5 %}Boost bij export: het EMS levert ≥ {{ min_import }} kW terug uit de thuisaccu voor **€ {{ '%.2f' | format(exp) | replace('.', ',') }}** kaal (≈ {{ (exp * 1000) | round(0) | int }} €/MWh) of minder
      (direct bij een aFRR-exportsessie, anders na 90 s){% if negeer %}, ook onder de accu-ondergrens{% else %} en de thuisaccu is ≥ {{ vloer }} %{% endif %}.
      Terug naar Smart boven € {{ '%.2f' | format(exp + 0.02) | replace('.', ',') }}, als het net minder dan 0,2 kW terugkrijgt{% if not negeer %} of als de thuisaccu onder {{ vloer - 2 }} % komt{% endif %}.
      {% else %}Boost bij export staat **uit**.{% endif %}
      {% if regelen %}Laadstroom geregeld: bij een boost op import krijgt de auto niet meer dan er naar de thuisaccu gaat, bij export niet meer dan er wordt teruggeleverd (op hele ampère).{% endif %}

  # --- Meldingen ---
  - type: conditional
    conditions:
      - condition: state
        entity: select.bevcc_evcc_modus
        state: unavailable
    card:
      type: markdown
      content: |
        <ha-alert alert-type="error">EVCC-laadpunt niet gevonden: <b>select.{{ states('input_text.bevcc_evcc_prefix') }}_{{ states('input_text.bevcc_evcc_laadpunt') }}_mode</b> bestaat niet of is onbereikbaar. Controleer <code>bevcc_evcc_prefix</code> en <code>bevcc_evcc_laadpunt</code> in secrets.yaml.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.bevcc_status
        state: pauze
    card:
      type: markdown
      content: |
        <ha-alert alert-type="warning">Laden gepauzeerd door een prijspiek. Daarna terug naar <b>{{ states('input_text.bevcc_te_herstellen_modus') }}</b>.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.bevcc_status
        state: boost
    card:
      type: markdown
      content: |
        {% set stroom = states('select.bevcc_evcc_max_laadstroom') %}
        {% set geregeld = is_state('input_boolean.bevcc_laadstroom_regelen', 'on') and is_number(stroom)
                          and states('input_text.bevcc_ingestelde_stroom') != 'handmatig' %}
        <ha-alert alert-type="success">Boost: {{ 'goedkope teruglevering' if state_attr('sensor.bevcc_doel', 'reden') == 'export' else 'goedkope EMS-import' }}, laden op {% if geregeld %}maximaal <b>{{ stroom }} A</b> (geregeld){% else %}vol vermogen{% endif %}. Daarna terug naar <b>smart</b>.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.bevcc_laadstroom_regelen
        state: "on"
      - condition: state
        entity: select.bevcc_evcc_max_laadstroom
        state: unavailable
    card:
      type: markdown
      content: |
        <ha-alert alert-type="warning">Laadstroom regelen staat aan, maar <b>select.{{ states('input_text.bevcc_evcc_prefix') }}_{{ states('input_text.bevcc_evcc_laadpunt') }}_max_current</b> bestaat niet of is onbereikbaar. Een boost laadt dan op vol vermogen.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: input_text.bevcc_ingestelde_stroom
        state: handmatig
    card:
      type: markdown
      content: |
        <ha-alert alert-type="info">Maximale laadstroom buiten BEVCC gewijzigd: BEVCC regelt de laadstroom niet meer tot de boost voorbij is.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.bevcc_status
        state: handmatig
    card:
      type: markdown
      content: |
        <ha-alert alert-type="info">Modus handmatig gewijzigd: BEVCC wacht tot de huidige pauze of boost voorbij is.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.bevcc_afrr_importsessie
        state: unavailable
    card:
      type: markdown
      content: |
        <ha-alert alert-type="error">Balans-API niet bereikbaar: aFRR-importsessies worden niet herkend. Is de sessiecookie verlopen?</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.bevcc_tennet_onbalans
        state: unavailable
    card:
      type: markdown
      content: |
        <ha-alert alert-type="warning">Live TenneT-prijs niet beschikbaar: BEVCC rekent met de kwartierprijs van Balans (loopt een paar minuten achter).</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.bevcc_afnameprijs
        state: unavailable
    card:
      type: markdown
      content: |
        <ha-alert alert-type="error">Geen afnameprijs beschikbaar (TenneT en Balans): BEVCC staat stil.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: automation.bevcc_prijssturing
        state: "off"
    card:
      type: markdown
      content: |
        <ha-alert alert-type="error">De automatisering <b>BEVCC prijssturing</b> staat uit.</ha-alert>
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.bevcc_update_beschikbaar
        state: "on"
    card:
      type: markdown
      content: |
        <ha-alert alert-type="info">BEVCC {{ state_attr('binary_sensor.bevcc_update_beschikbaar', 'laatste_versie') }} is beschikbaar (geïnstalleerd: {{ states('sensor.bevcc_versie') }}).</ha-alert>

  # --- Toestand ---
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: automation.bevcc_prijssturing
        name: Prijssturing
        color: green
      - type: tile
        entity: binary_sensor.bevcc_prijspiek
        name: Prijspiek
        color: red
      - type: tile
        entity: sensor.bevcc_laadvermogen
        name: Auto
      - type: tile
        entity: sensor.bevcc_thuisaccu_soc
        name: Thuisaccu
      - type: tile
        entity: sensor.bevcc_thuisaccu_vermogen
        name: Thuisaccu (+ = ontladen)
      - type: tile
        entity: sensor.bevcc_net_vermogen
        name: Net (+ = afname)

  # --- Instellingen ---
  - type: tile
    entity: select.bevcc_evcc_modus
    name: EVCC-modus
    features:
      - type: select-options
  - type: tile
    entity: input_select.bevcc_boost_bij
    name: Boost bij
    features:
      - type: select-options
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: input_number.bevcc_pauze_boven
        name: Pauze boven
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: input_number.bevcc_boost_onder
        name: Boost onder
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: input_number.bevcc_boost_min_import
        name: Boost min. EMS-vermogen
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: input_number.bevcc_accu_ondergrens
        name: Accu-ondergrens (boost)
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: input_number.bevcc_boost_export_onder
        name: Boost bij export onder (kaal)
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: input_boolean.bevcc_boost_export_negeer_ondergrens
        name: Export negeert accu-ondergrens
        color: orange
      - type: tile
        entity: input_boolean.bevcc_laadstroom_regelen
        name: Laadstroom regelen
        color: green
      - type: tile
        entity: select.bevcc_evcc_max_laadstroom
        name: EVCC max. laadstroom

  # --- Geschiedenis ---
  - type: history-graph
    title: Prijs en drempels (12 u)
    hours_to_show: 12
    entities:
      - entity: sensor.bevcc_afnameprijs
        name: Afnameprijs all-in (live)
      - entity: sensor.bevcc_boostprijs
        name: Boostprijs all-in
      - entity: sensor.bevcc_balans_kwartierprijs
        name: Balans kwartierprijs
      - entity: input_number.bevcc_pauze_boven
        name: Pauze boven
      - entity: input_number.bevcc_boost_onder
        name: Boost onder
      - entity: sensor.bevcc_exportprijs
        name: Exportprijs kaal
      - entity: input_number.bevcc_boost_export_onder
        name: Boost bij export onder (kaal)
  - type: history-graph
    title: Vermogen (12 u)
    hours_to_show: 12
    entities:
      - entity: sensor.bevcc_net_vermogen
        name: Net
      - entity: sensor.bevcc_thuisaccu_vermogen
        name: Thuisaccu
      - entity: sensor.bevcc_laadvermogen
        name: Auto
      - entity: sensor.bevcc_laadstroom_doel
        name: Laadstroom doel (A)
  - type: history-graph
    title: Status (12 u)
    hours_to_show: 12
    entities:
      - entity: input_select.bevcc_status
        name: Status
      - entity: select.bevcc_evcc_modus
        name: EVCC-modus
      - entity: sensor.bevcc_prijsbron
        name: Prijsbron
      - entity: binary_sensor.bevcc_prijspiek
        name: Prijspiek
      - entity: binary_sensor.bevcc_goedkope_import
        name: Goedkope import
      - entity: binary_sensor.bevcc_goedkope_export
        name: Goedkope export
      - entity: select.bevcc_evcc_max_laadstroom
        name: EVCC max. laadstroom
      - entity: binary_sensor.bevcc_auto_laadt
        name: Laden

  # --- Logboek pauze / boost / vrijgave ---
  - type: logbook
    title: Gebeurtenissen BEVCC
    hours_to_show: 48
    target:
      entity_id:
        - select.bevcc_evcc_modus

  # --- Details en tarieven ---
  - type: entities
    title: Details
    entities:
      - entity: sensor.bevcc_doel
        name: Doel op dit moment
      - entity: input_select.bevcc_status
        name: Status (beheerd door BEVCC)
      - entity: input_text.bevcc_te_herstellen_modus
        name: Te herstellen modus
      - entity: binary_sensor.bevcc_auto_aangesloten
        name: Auto aangesloten
      - entity: binary_sensor.bevcc_afrr_importsessie
        name: aFRR-importsessie (Balans)
      - entity: sensor.bevcc_balans_afrr_importprijs
        name: Balans aFRR-importprijs (kaal)
      - entity: sensor.bevcc_balans_dynamisch_prijs
        name: Balans dynamische prijs (kaal)
      - entity: sensor.bevcc_tennet_onbalans
        name: TenneT afnemen (kaal, €/MWh)
      - entity: binary_sensor.bevcc_afrr_exportsessie
        name: aFRR-exportsessie (Balans)
      - entity: binary_sensor.bevcc_dynamische_export
        name: Dynamische export (Balans)
      - entity: sensor.bevcc_balans_exportprijs
        name: Balans exportprijs (kaal)
      - entity: sensor.bevcc_exportprijs
        name: Exportprijs (kaal, live)
      - type: section
        label: Laadstroom
      - entity: sensor.bevcc_laadstroom_doel
        name: Doel tijdens boost
      - entity: input_text.bevcc_te_herstellen_stroom
        name: Te herstellen max. laadstroom
      - entity: input_text.bevcc_ingestelde_stroom
        name: Door BEVCC ingesteld
      - entity: sensor.bevcc_min_laadstroom
        name: Minimale laadstroom (EVCC)
      - entity: sensor.bevcc_laadfasen
        name: Fasen
      - type: section
        label: Tarieven (jaarlijks controleren)
      - entity: input_number.bevcc_energiebelasting
        name: Energiebelasting incl. btw
      - entity: input_number.bevcc_leverkosten
        name: Leverkosten incl. btw
      - entity: input_boolean.bevcc_standaardwaarden
        name: Standaardwaarden ingesteld (uit = herstellen)
      - type: section
        label: Versie
      - entity: sensor.bevcc_versie
        name: Geïnstalleerd
      - entity: sensor.bevcc_laatste_versie
        name: Nieuwste op GitHub
