# Voorbeeld voor BEVCC. Zet deze regels in je eigen /config/secrets.yaml
# (dit bestand zelf wordt niet gebruikt). Deel je secrets.yaml nooit en zet
# hem nooit in git: de cookie geeft volledige toegang tot je Balans-account.

# De hele Cookie-header van een ingelogde sessie op dashboard.balansenergie.nl
# (zie docs/cookie.md). Tussen dubbele aanhalingstekens.
bevcc_balans_cookie: "plak-hier-de-hele-cookie-header"

# Naam (prefix) van je EVCC-integratie, het eerste deel van de entiteit-ID's,
# zoals 'evcc' in sensor.evcc_grid_power.
bevcc_evcc_prefix: "evcc"

# Naam van het laadpunt, het middelste deel van select.<prefix>_<laadpunt>_mode,
# zoals 'alfen' in select.evcc_alfen_mode.
bevcc_evcc_laadpunt: "alfen"
